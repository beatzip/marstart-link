name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Check formatting (Rust)
        run: cargo fmt -- --check

      - name: Clippy (Rust lints)
        run: cargo clippy -- -D warnings

      - name: Run tests (Rust)
        run: cargo test -- --nocapture

      - name: Build Tauri app (debug, for PR)
        if: github.event_name == 'pull_request'
        run: cargo tauri build

      - name: Build Tauri app (release)
        if: github.event_name != 'pull_request'
        run: cargo tauri build --release
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts (debug builds - PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: game-accelerator-debug
          path: src-tauri/target/debug/*.exe

      - name: Upload artifacts (release builds)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: game-accelerator-release
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/updater/*.json
            src-tauri/target/release/bundle/updater/*.sig

      - name: Create GitHub Release and upload assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/updater/*.json
            src-tauri/target/release/bundle/updater/*.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}