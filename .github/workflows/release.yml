name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ✅ Создаём dist-заглушку для tauri::generate_context!()
      - name: Create dummy frontend dist
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Set-Content -Path "dist/index.html" -Value "<html><body>Game Accelerator MVP</body></html>"

      # ✅ Скачиваем SDK (wireguard-nt + wintun)
      - name: Download SDKs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/sdk"
          Invoke-WebRequest -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile "src-tauri/sdk/wg.zip"
          Expand-Archive -Path "src-tauri/sdk/wg.zip" -DestinationPath "src-tauri/sdk/" -Force
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "src-tauri/sdk/wintun.zip"
          Expand-Archive -Path "src-tauri/sdk/wintun.zip" -DestinationPath "src-tauri/sdk/" -Force

      - name: Clean cache
        run: |
          Remove-Item -Recurse -Force src-tauri\target -ErrorAction SilentlyContinue

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --verbose

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Game Accelerator ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: true
          projectPath: src-tauri