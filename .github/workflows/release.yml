name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ✅ Создаём валидный PNG (1x1 пиксель)
      - name: Create dummy assets
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Set-Content -Path "dist/index.html" -Value "<html><body>Game Accelerator</body></html>"
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          # Минимальный валидный PNG (base64)
          $pngBytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==")
          [System.IO.File]::WriteAllBytes("src-tauri/icons/icon.png", $pngBytes)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/32x32.png", $pngBytes)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/128x128.png", $pngBytes)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/icon.ico", $pngBytes)

      - name: Download SDKs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/sdk"
          Invoke-WebRequest -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile "src-tauri/sdk/wg.zip"
          Expand-Archive -Path "src-tauri/sdk/wg.zip" -DestinationPath "src-tauri/sdk/" -Force
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "src-tauri/sdk/wintun.zip"
          Expand-Archive -Path "src-tauri/sdk/wintun.zip" -DestinationPath "src-tauri/sdk/" -Force

      - name: Clean cache
        run: |
          Remove-Item -Recurse -Force src-tauri\target -ErrorAction SilentlyContinue

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --verbose

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Game Accelerator ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: true
          projectPath: src-tauri