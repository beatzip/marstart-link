name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Show commit
        run: git rev-parse HEAD

      - name: Hard clean workspace
        shell: pwsh
        run: |
          git reset --hard
          git clean -xfd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify frontend build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) {
            Write-Error "Frontend build failed: dist/index.html missing"
            exit 1
          }
          if (!(Test-Path "src-tauri/icons/icon.ico")) {
            Write-Error "Tauri icons missing: run from full repo (src-tauri/icons/)"
            exit 1
          }

      - name: Download WireGuard-NT SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/sdk" | Out-Null
          Invoke-WebRequest -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile "src-tauri/sdk/wireguard-nt.zip"
          $wgHash = (Get-FileHash "src-tauri/sdk/wireguard-nt.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wgHash -ne "dceb30a9bc4be48cce0f74160fc88a585a2c2627366e8f846fc6658f9038dace") {
            throw "WireGuard-NT archive checksum mismatch: $wgHash"
          }
          Expand-Archive -Path "src-tauri/sdk/wireguard-nt.zip" -DestinationPath "src-tauri/sdk/wireguard-nt" -Force

      - name: Copy DLLs to resources
        shell: pwsh
        run: |
          $wg = Get-ChildItem "src-tauri/sdk/wireguard-nt" -Recurse -Filter "wireguard.dll" | Select-Object -First 1
          if (-not $wg) { Write-Error "wireguard.dll not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item $wg.FullName -Destination "src-tauri/resources/wireguard.dll" -Force
          Write-Host "wireguard.dll copied to src-tauri/resources/"

      - name: Verify bundled resources
        shell: pwsh
        run: |
          $dll = "wireguard.dll"
          $path = Join-Path 'src-tauri/resources' $dll
          if (!(Test-Path $path)) {
            Write-Error "Missing bundled resource: $path"
            exit 1
          }
          $sizeKB = [math]::Round((Get-Item $path).Length / 1KB, 1)
          Write-Host "${dll}: ${sizeKB} KB"
          if ((Get-Item $path).Length -lt 100KB) {
            Write-Error "${dll} is suspiciously small (${sizeKB} KB < 100 KB) — likely a stub or corrupt file"
            exit 1
          }
          Write-Host "Resource check passed."

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --release --locked --verbose

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MARSTART LINK ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          projectPath: ./src-tauri

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $bundles = @(
            Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Include "*.exe","*.msi" `
              | Where-Object { $_.Name -notlike "*debug*" }
          )
          if ($bundles.Count -eq 0) {
            Write-Error "No installer found in src-tauri/target/release/bundle/"
            exit 1
          }
          foreach ($f in $bundles) {
            $sizeMB = [math]::Round($f.Length / 1MB, 2)
            Write-Host "Installer: $($f.Name)  ($sizeMB MB)"
            if ($f.Length -lt 3MB) {
              Write-Error "$($f.Name) is only ${sizeMB} MB — DLLs are likely missing from the bundle"
              exit 1
            }
          }
          Write-Host "Installer size check passed."

      - name: Embed requireAdministrator manifest into release binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "marstart-link.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Release binary not found in src-tauri/target/release/"
            exit 1
          }
          # Robustly locate mt.exe across any installed Windows SDK version.
          # windows-latest may ship a newer SDK than the originally-pinned
          # version, so globbing avoids a brittle hardcoded path. We pick the
          # highest installed version and fail loudly if none is found.
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "mt.exe" |
            Where-Object { $_.FullName -like "*\x64\mt.exe" } |
            Sort-Object { [Version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) {
            Write-Error "mt.exe not found under Windows Kits\10\bin — install the Windows SDK (Desktop Build Tools) with the C++ build tools"
            exit 1
          }
          Write-Host "Embedding manifest into: $($exe.FullName)"
          & $mt -manifest "src-tauri/src-tauri.manifest" -outputresource:"$($exe.FullName);#1" -nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Error "mt.exe failed to embed manifest"
            exit 1
          }
          Write-Host "Manifest embedded successfully: requireAdministrator"

      - name: Verify embedded manifest (requireAdministrator)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "marstart-link.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Release binary not found"
            exit 1
          }
          # Robustly locate mt.exe across any installed Windows SDK version.
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "mt.exe" |
            Where-Object { $_.FullName -like "*\x64\mt.exe" } |
            Sort-Object { [Version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) {
            Write-Error "mt.exe not found under Windows Kits\10\bin — install the Windows SDK (Desktop Build Tools) with the C++ build tools"
            exit 1
          }
          $out = "$env:TEMP\marstart_manifest_check.xml"
          & $mt -inputresource:"$($exe.FullName);#1" -out:"$out" -nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to extract manifest from binary"
            exit 1
          }
          $content = Get-Content $out -Raw
          if ($content -match 'requireAdministrator') {
            Write-Host "PASS: Manifest contains requireAdministrator"
          } else {
            Write-Error "FAIL: Manifest does NOT contain requireAdministrator"
            Write-Host $content
            exit 1
          }
          Remove-Item $out -ErrorAction SilentlyContinue

      - name: Run WireGuard tests
        shell: pwsh
        working-directory: src-tauri
        run: |
          $src = "resources/wireguard.dll"
          if (!(Test-Path $src)) {
            Write-Error "Missing $src — Copy DLLs to resources must run first"
            exit 1
          }
          # get_dll_path() uses current_exe() dir → for cargo test that is target/debug/deps/
          $dirs = @(
            "target/debug",
            "target/debug/deps",
            "target/release",
            "target/release/deps"
          )
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Copy-Item $src -Destination (Join-Path $d "wireguard.dll") -Force
            Write-Host "Staged: $(Join-Path $d 'wireguard.dll') size=$((Get-Item (Join-Path $d 'wireguard.dll')).Length)"
          }
          # cargo may recreate deps; stage again right before test via a wrapper is overkill —
          # but verify the critical path exists:
          if (!(Test-Path "target/debug/deps/wireguard.dll")) {
            Write-Error "Staging failed: target/debug/deps/wireguard.dll missing"
            exit 1
          }
          cargo test --all-features --locked wireguard -- --test-threads=1
