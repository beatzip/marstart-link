name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Show commit
        run: git rev-parse HEAD

      - name: Hard clean workspace
        shell: pwsh
        run: |
          git reset --hard
          git clean -xfd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify frontend build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) {
            Write-Error "Frontend build failed: dist/index.html missing"
            exit 1
          }
          if (!(Test-Path "src-tauri/icons/icon.ico")) {
            Write-Error "Tauri icons missing: run from full repo (src-tauri/icons/)"
            exit 1
          }

      - name: Download SDKs (WireGuard + Wintun)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/sdk" | Out-Null
          Invoke-WebRequest -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile "src-tauri/sdk/wireguard-nt.zip"
          Expand-Archive -Path "src-tauri/sdk/wireguard-nt.zip" -DestinationPath "src-tauri/sdk/wireguard-nt" -Force
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "src-tauri/sdk/wintun.zip"
          Expand-Archive -Path "src-tauri/sdk/wintun.zip" -DestinationPath "src-tauri/sdk/wintun" -Force

      - name: Copy DLLs to resources
        shell: pwsh
        run: |
          $wg = Get-ChildItem "src-tauri/sdk/wireguard-nt" -Recurse -Filter "wireguard.dll" | Select-Object -First 1
          $wt = Get-ChildItem "src-tauri/sdk/wintun" -Recurse -Filter "wintun.dll" | Select-Object -First 1
          if (-not $wg) { Write-Error "wireguard.dll not found"; exit 1 }
          if (-not $wt) { Write-Error "wintun.dll not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item $wg.FullName -Destination "src-tauri/resources/wireguard.dll" -Force
          Copy-Item $wt.FullName -Destination "src-tauri/resources/wintun.dll" -Force
          Write-Host "DLLs copied to src-tauri/resources/"

      - name: Verify bundled resources
        shell: pwsh
        run: |
          foreach ($dll in @('wireguard.dll', 'wintun.dll')) {
            $path = Join-Path 'src-tauri/resources' $dll
            if (!(Test-Path $path)) {
              Write-Error "Missing bundled resource: $path"
              exit 1
            }
            $sizeKB = [math]::Round((Get-Item $path).Length / 1KB, 1)
            Write-Host "${dll}: ${sizeKB} KB"
            if ((Get-Item $path).Length -lt 100KB) {
              Write-Error "${dll} is suspiciously small (${sizeKB} KB < 100 KB) — likely a stub or corrupt file"
              exit 1
            }
          }
          Write-Host "All DLL size checks passed."

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --release --locked --verbose

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MARSTART LINK ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          projectPath: ./src-tauri

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $bundles = @(
            Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Include "*.exe","*.msi" `
              | Where-Object { $_.Name -notlike "*debug*" }
          )
          if ($bundles.Count -eq 0) {
            Write-Error "No installer found in src-tauri/target/release/bundle/"
            exit 1
          }
          foreach ($f in $bundles) {
            $sizeMB = [math]::Round($f.Length / 1MB, 2)
            Write-Host "Installer: $($f.Name)  ($sizeMB MB)"
            if ($f.Length -lt 3MB) {
              Write-Error "$($f.Name) is only ${sizeMB} MB — DLLs are likely missing from the bundle"
              exit 1
            }
          }
          Write-Host "Installer size check passed."