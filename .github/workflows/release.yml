name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

       - name: Create dummy assets
        shell: pwsh
        run: |
          # 1. Frontend dist
          New-Item -ItemType Directory -Force -Path "dist"
          Set-Content -Path "dist/index.html" -Value "<html><body>Game Accelerator MVP</body></html>"
          
          # 2. Создаём валидные иконки через Base64
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          
          # Минимальный валидный PNG (1x1 пиксель, прозрачный)
          $pngBase64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
          $pngBytes = [Convert]::FromBase64String($pngBase64)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/icon.png", $pngBytes)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/32x32.png", $pngBytes)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/128x128.png", $pngBytes)
          
          # Минимальный валидный ICO (16x16, 1-bit цвет)
          $icoBase64 = "AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A"
          $icoBytes = [Convert]::FromBase64String($icoBase64)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/icon.ico", $icoBytes)
          
          Write-Host "✅ Valid icons created from Base64"
          Get-ChildItem "src-tauri/icons" | Format-Table Name, Length
      - name: Download SDKs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/sdk"
          Invoke-WebRequest -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile "src-tauri/sdk/wg.zip"
          Expand-Archive -Path "src-tauri/sdk/wg.zip" -DestinationPath "src-tauri/sdk/" -Force
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "src-tauri/sdk/wintun.zip"
          Expand-Archive -Path "src-tauri/sdk/wintun.zip" -DestinationPath "src-tauri/sdk/" -Force

      - name: Clean cache
        run: |
          Remove-Item -Recurse -Force src-tauri\target -ErrorAction SilentlyContinue

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --verbose

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Game Accelerator ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: true
          projectPath: src-tauri