name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      # ---------------------------
      # Checkout (С ЧИСТКОЙ)
      # ---------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # ---------------------------
      # Debug commit state
      # ---------------------------
      - name: Show commit
        run: git rev-parse HEAD

      - name: Show status
        run: git status

      # ---------------------------
      # Force clean workspace (КРИТИЧНО)
      # ---------------------------
      - name: Hard clean workspace
        shell: pwsh
        run: |
          git reset --hard
          git clean -xfd

      # ---------------------------
      # Node.js
      # ---------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---------------------------
      # Rust toolchain
      # ---------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ---------------------------
      # Rust cache (ОГРАНИЧЕННЫЙ)
      # ---------------------------
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false

      # ---------------------------
      # Add Windows target
      # ---------------------------
      - name: Setup Rust (Windows)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      # ---------------------------
      # Rust format check
      # ---------------------------
      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # ---------------------------
      # Clippy (strict)
      # ---------------------------
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # ---------------------------
      # Install frontend deps
      # ---------------------------
      - name: Install frontend dependencies
        run: npm ci

      # ---------------------------
      # Build frontend
      # ---------------------------
      - name: Build frontend
        run: npm run build

      # ---------------------------
      # Verify frontend build
      # ---------------------------
      - name: Verify frontend build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) {
            Write-Error "Frontend build failed: dist/index.html missing"
            exit 1
          }

      # ---------------------------
      # Download SDKs
      # ---------------------------
      - name: Download SDKs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/sdk" | Out-Null

          Invoke-WebRequest `
            -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" `
            -OutFile "src-tauri/sdk/wireguard-nt.zip"

          Expand-Archive `
            -Path "src-tauri/sdk/wireguard-nt.zip" `
            -DestinationPath "src-tauri/sdk/wireguard-nt" `
            -Force

          Invoke-WebRequest `
            -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" `
            -OutFile "src-tauri/sdk/wintun.zip"

          Expand-Archive `
            -Path "src-tauri/sdk/wintun.zip" `
            -DestinationPath "src-tauri/sdk/wintun" `
            -Force

      # ---------------------------
      # Verify SDKs
      # ---------------------------
      - name: Verify SDK files
        shell: pwsh
        run: |
          $wg = Get-ChildItem "src-tauri/sdk/wireguard-nt" -Recurse -Filter "wireguard.dll" | Select-Object -First 1
          $wt = Get-ChildItem "src-tauri/sdk/wintun" -Recurse -Filter "wintun.dll" | Select-Object -First 1

          if (-not $wg) { Write-Error "wireguard.dll missing"; exit 1 }
          if (-not $wt) { Write-Error "wintun.dll missing"; exit 1 }

      # ---------------------------
      # FINAL CLEAN BUILD STATE (ВАЖНО)
      # ---------------------------
      - name: Cargo clean (critical)
        working-directory: src-tauri
        run: cargo clean

      # ---------------------------
      # Cargo check (release)
      # ---------------------------
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --release --verbose

      # ---------------------------
      # Build Tauri App
      # ---------------------------
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Game Accelerator ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          projectPath: .