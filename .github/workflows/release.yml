name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # важно для тегов

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ==================== SDKs ====================
      - name: Download SDKs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/sdk"

          Invoke-WebRequest "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile "src-tauri/sdk/wireguard-nt.zip"
          Expand-Archive "src-tauri/sdk/wireguard-nt.zip" -DestinationPath "src-tauri/sdk/wireguard-nt" -Force

          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "src-tauri/sdk/wintun.zip"
          Expand-Archive "src-tauri/sdk/wintun.zip" -DestinationPath "src-tauri/sdk/wintun" -Force

      - name: Verify frontend build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) {
            Write-Error "Frontend build failed"
            exit 1
          }

      # ==================== Rust ====================
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --verbose

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-msvc

      # ==================== Tauri Build ====================
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v2   # ← обновили до v2!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Game Accelerator ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          projectPath: "."                    # или ./src-tauri, если conf в src-tauri